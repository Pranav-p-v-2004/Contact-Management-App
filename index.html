<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact CRUD</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container my-5">
        <h1 class="text-center text-primary">Contact Management CRUD</h1>
        <form id="userform">
            <div class="row my-5">
                <div class="col-lg-4">
                    <input id="cName" type="text" placeholder="Contact Name" class="form-control">
                </div>
                <div class="col-lg-4">
                    <input id="cPhone" type="text" placeholder="Phone Number" class="form-control">
                </div>
                <div class="col-lg-4">
                    <input id="cEmail" type="email" placeholder="Email Address" class="form-control">
                </div>
                <div class="col-lg-3 mt-4">
                    <button type="submit" class="btn btn-success w-100" id="submitBtn">
                        Add Contact
                    </button>
                </div>

            </div>

            <div class="row my-5">

                <div class="col-lg-6">
                    <input id="searchContact" type="text" placeholder="Search Contact Name"
                        class="form-control">
                </div>

            </div>

        </form>

        <!-- Table -->

        <table class="my-5 table table-bordered table-hover">
            <thead class="table-dark text-center">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Email Address</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>

    </div>

</body>

<script src="main.js"></script>

</html>
